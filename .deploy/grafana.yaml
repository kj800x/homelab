# Third-party images resolve through tag parameters (see
# https://github.com/kj800x/homelab/issues/7). The pattern is a semver
# range over the image's tags as watchtower sees them.
parameters:
  GRAFANA:
    type: tag
    image: docker.io/grafana/grafana-enterprise
    pattern: "^12.4.10"
  POSTGRES:
    type: tag
    image: docker.io/library/postgres
    pattern: "^15.11.0"

team: cluster-infra
kind: service
namespace: grafana
