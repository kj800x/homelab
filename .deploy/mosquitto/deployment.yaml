apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  revisionHistoryLimit: 1
  replicas: 1
  # Single-replica app with state on NFS: never run two copies at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:$MOSQUITTO
          command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          volumeMounts:
            - name: mosquitto-storage
              mountPath: /mosquitto
          ports:
            - containerPort: 1883
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          # MQTT listener. (9001/websockets isn't enabled in mosquitto.conf.)
          startupProbe:
            tcpSocket:
              port: 1883
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 1883
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 1883
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: mosquitto-storage
          nfs:
            server: 10.60.1.15
            path: /data/services/mosquitto
