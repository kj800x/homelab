# Read-only, cluster-wide: kube-state-metrics lists/watches these objects
# and turns their state into Prometheus metrics. Keep in sync with --resources in deployment.yaml.
# (cicd reads one YAML document per file, hence the separate files.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
