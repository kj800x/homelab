apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: grafana
  labels:
    app: loki
spec:
  revisionHistoryLimit: 1
  replicas: 1
  # Single-replica app with state on NFS: never run two copies at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:$LOKI
          args:
            - "--config.file=/mnt/config/loki-config.yaml"
          ports:
            - containerPort: 3100
          # Not /ready: it's stuck at 503 on the pattern ingester ring, which would pull Loki out of its Service.

          startupProbe:
            httpGet:
              path: /loki/api/v1/status/buildinfo
              port: 3100
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /loki/api/v1/status/buildinfo
              port: 3100
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /loki/api/v1/status/buildinfo
              port: 3100
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: loki-config
              mountPath: /mnt/config
              readOnly: true
      volumes:
        - name: loki-config
          nfs:
            server: 10.60.1.15
            path: /data/services/loki/config
