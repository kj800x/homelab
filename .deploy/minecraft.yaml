# Third-party images resolve through tag parameters (see
# https://github.com/kj800x/homelab/issues/7). The pattern is a semver
# range over the image's tags as watchtower sees them.
parameters:
  MINECRAFT_SERVER:
    type: tag
    image: docker.io/itzg/minecraft-server
    pattern: "^2026.9.0"

team: kj800x
kind: service
namespace: minecraft

# A deploy restarts the server and drops everyone on it, so hold while
# anyone is connected (acknowledge the soft block to go anyway).
checks:
  pre:
    - name: minecraft-players
      http: http://deploy-checks.cicd.svc/minecraft/players
