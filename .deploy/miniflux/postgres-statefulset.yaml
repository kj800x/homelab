# StatefulSet rather than Deployment: at most one postgres-0 exists at a
# time, including when a node drops off (a Deployment would start a
# replacement while the old pod might still be writing to the NFS dir).
# Updates delete postgres-0 before creating the new one.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: miniflux
  labels:
    app: postgres
spec:
  serviceName: postgres
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:$POSTGRES
          command:
            - "docker-entrypoint.sh"
          args:
            - "postgres"
          env:
            - name: POSTGRES_USER
              value: "miniflux"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin-secret
                  key: ADMIN_PASSWORD
          ports:
            - containerPort: 5432
          # pg_isready = actually accepting connections, not just port open.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "miniflux", "-d", "miniflux", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 120  # 10 min for crash recovery on NFS
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "miniflux", "-d", "miniflux", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "miniflux", "-d", "miniflux", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          nfs:
            server: 10.60.1.15
            path: /data/services/miniflux-postgres18
