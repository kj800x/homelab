# Third-party images resolve through tag parameters (see
# https://github.com/kj800x/homelab/issues/7). The pattern is a semver
# range over the image's tags as watchtower sees them.
parameters:
  WYZE_BRIDGE:
    type: tag
    image: docker.io/mrlt8/wyze-bridge
    pattern: "^2.10.3"

# Should we make a timelapse team?
team: home-sensors
kind: service
namespace: home-sensors
