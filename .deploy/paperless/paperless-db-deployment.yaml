apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: paperless
spec:
  replicas: 1
  # Never run two postgres instances against the same NFS data dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless-postgres
  template:
    metadata:
      labels:
        app: paperless-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:$POSTGRES
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: paperless
            - name: POSTGRES_USER
              value: paperless
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          # pg_isready = actually accepting connections, not just port open.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "paperless", "-d", "paperless", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 120  # 10 min for crash recovery on NFS
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "paperless", "-d", "paperless", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "paperless", "-d", "paperless", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: pgdata
          nfs:
            server: 10.60.1.15
            path: /data/services/paperless/postgres
