# Fields (labels become secret keys):
#   RESTIC_REPOSITORY      s3:https://s3.<region>.backblazeb2.com/<bucket>/paperless
#   RESTIC_PASSWORD        restic repo encryption password (losing it = losing the backups)
#   AWS_ACCESS_KEY_ID      B2 application keyID
#   AWS_SECRET_ACCESS_KEY  B2 application key
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: paperless-backup
  namespace: paperless
spec:
  itemPath: "vaults/kube/items/paperless-backup"
