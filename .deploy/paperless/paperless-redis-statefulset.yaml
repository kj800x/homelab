# StatefulSet rather than Deployment: at most one broker-0 exists at a
# time, including when a node drops off (a Deployment would start a
# replacement while the old pod might still be writing to the NFS dir).
# Updates delete broker-0 before creating the new one.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  namespace: paperless
spec:
  serviceName: broker
  revisionHistoryLimit: 1
  replicas: 0  # TEMP: step 1 of Deployment -> StatefulSet swap
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:$REDIS
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redisdata
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redisdata
          nfs:
            server: 10.60.1.15
            path: /data/services/paperless/redis
