apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:$REDIS
        ports:
        - containerPort: 6379
        startupProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
